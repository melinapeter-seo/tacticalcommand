# Netlify: build estático de Astro. El deploy se dispara con cada push a main y con el Build Hook
# que llama Apps Script al "Publicar" desde el panel (fase 2).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # URL de la Web App de Apps Script (fase 2). Mientras esté vacía, el seguimiento muestra
  # un aviso con salida a WhatsApp y el arrepentimiento usa Netlify Forms.
  # PUBLIC_TC_API = "https://script.google.com/macros/s/XXXX/exec"

# Caché inmutable para los archivos con hash.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://www.facebook.com; font-src 'self'; media-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    # HSTS: activar recién con el dominio definitivo y HTTPS funcionando.
    # Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
