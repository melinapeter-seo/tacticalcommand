name: Build, API y chequeo SEO
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - name: Semilla.gs al día con src/data
        run: npm run semilla && git diff --exit-code apps-script/Semilla.gs
      - run: npm run build
      - run: npm run check:seo
